<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agents">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Agents</title>
<style>
  :root { --bg: #131316; --panel: #1b1b1f; --raised: #232328; --line: #2e2e35; --text: #ececf1; --dim: #9b9ba7; --faint: #6c6c78;
          --accent: #ffcb05; --you: #2b2b33; --ok: #4ade80; --warn: #ff7a59; --radius: 14px; --width: 760px; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
         -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { max-width: var(--width); margin: 0 auto; padding: 0 16px; }

  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(14px);
           border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
  header .wrap { display: flex; align-items: center; gap: 10px; min-height: 54px; }
  header .titles { flex: 1; min-width: 0; }
  header h1 { margin: 0; font-size: 16px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .meta { font-size: 12.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon { width: 26px; height: 26px; image-rendering: pixelated; flex: none; }
  .icon.idle { opacity: .35; filter: grayscale(1); }
  .back { border: 0; background: none; color: var(--dim); font-size: 26px; line-height: 1; padding: 4px 8px 6px 0; }
  .away { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); }
  .toggle { position: relative; width: 40px; height: 24px; border-radius: 99px; background: var(--raised); border: 1px solid var(--line); transition: .15s; }
  .toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--dim); transition: .15s; }
  .toggle.on { background: var(--accent); border-color: var(--accent); }
  .toggle.on::after { left: 18px; background: #1a1a1a; }
  .tabs { display: flex; gap: 4px; padding: 0 0 10px; }
  .tab { flex: 1; border: 0; background: none; color: var(--dim); padding: 7px; border-radius: 10px; font-size: 14px; }
  .tab.on { background: var(--raised); color: var(--text); font-weight: 600; }

  main { padding: 6px 0 calc(110px + env(safe-area-inset-bottom)); }
  .section { margin: 22px 2px 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); display: flex; gap: 8px; }
  .section button { all: unset; cursor: pointer; display: flex; gap: 8px; width: 100%; }
  .section .count { margin-left: auto; font-weight: 500; letter-spacing: 0; text-transform: none; }
  .row { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 11px 12px; margin: 0 0 6px; background: var(--panel);
         border: 1px solid transparent; border-radius: var(--radius); }
  .row:hover { border-color: var(--line); }
  .row.held { border-color: color-mix(in srgb, var(--accent) 70%, transparent); background: color-mix(in srgb, var(--accent) 7%, var(--panel)); }
  .row .body { flex: 1; min-width: 0; }
  .row .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sub { font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .age { font-size: 12px; color: var(--faint); flex: none; }
  .row:disabled { opacity: .45; cursor: default; }
  .chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--raised); color: var(--dim); margin-left: 6px; vertical-align: 1px; }
  .chip.accent { background: var(--accent); color: #1a1a1a; }
  .empty { text-align: center; color: var(--dim); margin: 64px 0; }
  .hint { text-align: center; color: var(--faint); font-size: 13px; margin: 28px 0; }

  .bubble { margin: 14px 0 14px auto; width: fit-content; max-width: 85%; padding: 9px 13px; border-radius: 18px 18px 4px 18px; background: var(--you);
            white-space: pre-wrap; overflow-wrap: anywhere; }
  .bubble .status { display: block; margin-top: 3px; font-size: 11px; color: var(--faint); text-align: right; }
  .bubble.failed .status { color: var(--warn); }
  .agent { margin: 12px 0; overflow-wrap: anywhere; }
  .agent p { margin: 0 0 10px; } .agent p:last-child { margin-bottom: 0; }
  .agent h3 { font-size: 15px; margin: 14px 0 6px; }
  .agent ul, .agent ol { margin: 4px 0 10px; padding-left: 22px; }
  .agent li { margin: 2px 0; }
  .agent code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--raised); border-radius: 5px; padding: 1px 5px; }
  .agent pre { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; overflow-x: auto; }
  .agent pre code { background: none; padding: 0; }
  .agent a { color: var(--accent); }
  .agent blockquote { margin: 6px 0; padding-left: 10px; border-left: 3px solid var(--line); color: var(--dim); }
  .agent table { border-collapse: collapse; margin: 6px 0 10px; font-size: 13.5px; display: block; overflow-x: auto; }
  .agent td, .agent th { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
  .note { font-size: 13px; color: var(--dim); border-left: 2px solid var(--accent); padding: 2px 10px; margin: 10px 0; white-space: pre-wrap; }
  details.steps { margin: 6px 0; color: var(--faint); font-size: 13px; }
  details.steps summary { cursor: pointer; list-style: none; padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  details.steps summary::-webkit-details-marker { display: none; }
  details.steps summary::before { content: "▸ "; }
  details.steps[open] summary::before { content: "▾ "; }
  details.steps div { font: 12px ui-monospace, Menlo, monospace; padding: 2px 0 2px 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(14px);
          border-top: 1px solid var(--line); padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); }
  .waiting { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--accent); margin-bottom: 8px; }
  .waiting::before { content: ""; width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
  .options { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .options button { background: var(--raised); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; font-size: 14px; }
  .composer { display: flex; align-items: flex-end; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 6px 6px 6px 14px; }
  .composer:focus-within { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
  .composer textarea { flex: 1; resize: none; border: 0; outline: 0; background: none; color: var(--text); font: inherit; font-size: 16px; line-height: 1.45;
                       max-height: 160px; padding: 6px 0; }
  .send { width: 34px; height: 34px; flex: none; border: 0; border-radius: 50%; background: var(--accent); color: #1a1a1a; font-size: 17px; font-weight: 700; }
  .send:disabled { background: var(--raised); color: var(--faint); cursor: default; }
  .keys { font-size: 11px; color: var(--faint); margin-top: 6px; text-align: right; }
  @media (pointer: coarse) { .keys { display: none; } }

  .pair { max-width: 380px; margin: 12vh auto 0; padding: 0 20px; text-align: center; }
  .pair h2 { margin: 0 0 8px; }
  .pair input { width: 100%; margin: 6px 0; padding: 12px; font: inherit; font-size: 16px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; text-align: center; }
  .pair input.code { font-size: 24px; letter-spacing: .3em; }
  .pair .primary { width: 100%; margin-top: 8px; padding: 12px; border: 0; border-radius: 12px; background: var(--accent); color: #1a1a1a; font-weight: 650; }
  .muted { color: var(--dim); font-size: 14px; }
  .toast { position: fixed; left: 50%; bottom: calc(120px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #000; color: #fff; padding: 9px 14px;
           border-radius: 12px; font-size: 14px; max-width: 90%; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: .92; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
"use strict";
const touch = matchMedia("(pointer: coarse)").matches;
const store = {
  get token() { return localStorage.getItem("agents.token"); },
  set token(v) { v ? localStorage.setItem("agents.token", v) : localStorage.removeItem("agents.token"); },
  get computer() { return localStorage.getItem("agents.computer") || ""; },
  set computer(v) { localStorage.setItem("agents.computer", v); },
};
const app = document.getElementById("app");
let view = { name: localStorage.getItem("agents.tab") || "list" }, data = null, timer = null, lastFrame = "", openSteps = new Set();

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k === "html") node.innerHTML = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) node.setAttribute(k, v === true ? "" : v);
  }
  for (const child of children.flat(Infinity)) if (child != null && child !== false) node.append(child.nodeType ? child : String(child));
  return node;
}

function toast(text) {
  const t = document.getElementById("toast");
  t.textContent = text; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 3200);
}

async function api(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "Content-Type": "application/json", ...(store.token ? { Authorization: "Bearer " + store.token } : {}) },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const json = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== "/api/pair") { store.token = null; lastFrame = ""; render(); throw new Error(json.error); }
  if (!res.ok) throw new Error(json.error || res.statusText);
  return json;
}

function ago(since) {
  const m = Math.floor((Date.now() / 1000 - since) / 60);
  return m < 1 ? "now" : m < 60 ? m + "m" : m < 1440 ? Math.floor(m / 60) + "h" : Math.floor(m / 1440) + "d";
}

// Markdown for agent replies: escape everything first, then add the few constructs agents use.
function markdown(source) {
  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out = [], lines = source.replace(/\r/g, "").split("\n");
  let list = null, para = [];
  const endPara = () => { if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; } };
  const endList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith("```")) {
      endPara(); endList(); const code = [];
      while (++i < lines.length && !lines[i].startsWith("```")) code.push(lines[i]);
      out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>"); continue;
    }
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      endPara(); endList();
      const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim()));
      let html = "<table><tr>" + cells(line).map((c) => `<th>${c}</th>`).join("") + "</tr>"; i++;
      while (i + 1 < lines.length && /^\s*\|.*\|\s*$/.test(lines[i + 1])) html += "<tr>" + cells(lines[++i]).map((c) => `<td>${c}</td>`).join("") + "</tr>";
      out.push(html + "</table>"); continue;
    }
    const heading = line.match(/^#{1,4}\s+(.*)/), bullet = line.match(/^\s*[-*]\s+(.*)/), numbered = line.match(/^\s*\d+[.)]\s+(.*)/), quote = line.match(/^>\s?(.*)/);
    if (heading) { endPara(); endList(); out.push(`<h3>${inline(heading[1])}</h3>`); }
    else if (bullet || numbered) {
      const kind = bullet ? "ul" : "ol";
      endPara();
      if (list !== kind) { endList(); out.push(`<${kind}>`); list = kind; }
      out.push(`<li>${inline((bullet || numbered)[1])}</li>`);
    }
    else if (quote) { endPara(); endList(); out.push(`<blockquote>${inline(quote[1])}</blockquote>`); }
    else if (!line.trim()) { endPara(); endList(); }
    else { endList(); para.push(line); }
  }
  endPara(); endList();
  return out.join("");
}

async function pair(payload) {
  try {
    const res = await api("/api/pair", { ...payload, device: localStorage.getItem("agents.device") || (touch ? "iPhone" : "Browser") });
    store.token = res.token; store.computer = res.computer;
    history.replaceState(null, "", "/");
    toast("Paired with " + res.computer); lastFrame = ""; render();
  } catch (e) { toast(e.message); }
}

function pairView() {
  const code = el("input", { class: "code", inputmode: "numeric", maxlength: 6, placeholder: "000000", autocomplete: "one-time-code" });
  const name = el("input", { placeholder: "Name this device", value: localStorage.getItem("agents.device") || (touch ? "iPhone" : "Browser") });
  return el("div", { class: "pair" },
    el("h2", {}, "Pair with your Mac"),
    el("p", { class: "muted" }, "In the menu bar on your Mac choose Phone → Pair a phone, then scan the QR code, or type the code here."),
    name, code,
    el("button", { class: "primary", onclick: () => { localStorage.setItem("agents.device", name.value.trim() || "iPhone"); pair({ code: code.value }); } }, "Pair"));
}

const icon = (state) => "data:image/png;base64," + (data.theme.icons[state === "idle" ? "quiet" : state] || data.theme.icons.quiet);
const label = (state) => data.theme.labels[state] || "idle";
function go(next) { view = next; lastFrame = ""; delete app.dataset.session; if (next.name !== "session") localStorage.setItem("agents.tab", next.name); render(); window.scrollTo(0, 0); }

function topBar() {
  return el("header", {}, el("div", { class: "wrap" },
    el("div", { class: "titles" }, el("h1", {}, "Agents"), el("div", { class: "meta" }, store.computer || data.computer)),
    el("label", { class: "away" }, "Away",
      el("button", { class: "toggle" + (data.away ? " on" : ""), "aria-label": "Away mode", onclick: async () => {
        try { const r = await api("/api/away", { on: !data.away }); toast(r.away ? "Away on — agents' questions wait for you here" : "Away off"); lastFrame = ""; render(); }
        catch (err) { toast(err.message); }
      } }))),
    el("div", { class: "wrap" }, el("nav", { class: "tabs" },
      el("button", { class: "tab" + (view.name === "list" ? " on" : ""), onclick: () => go({ name: "list" }) }, "Active"),
      el("button", { class: "tab" + (view.name === "workspaces" ? " on" : ""), onclick: () => go({ name: "workspaces" }) }, "Workspaces"))));
}

function sessionRow(s) {
  const what = s.held ? "Asks: " + (s.held.questions[0]?.question || "a question") : (s.doing || s.quote);
  return el("button", { class: "row" + (s.held ? " held" : ""), onclick: () => go({ name: "session", id: s.id, back: view.name }) },
    el("img", { class: "icon", src: icon(s.state), alt: "" }),
    el("div", { class: "body" },
      el("div", { class: "title" }, s.name, s.queued ? el("span", { class: "chip" }, "queued") : null),
      el("div", { class: "sub" }, [s.place && s.place !== s.name ? s.place : null, s.unit, what].filter(Boolean).join(" · "))),
    el("div", { class: "age" }, ago(s.since)));
}

function listView() {
  const held = data.sessions.filter((s) => s.held);
  const groups = ["waiting", "failed", "working", "done", "quiet"].map((state) => [state, data.sessions.filter((s) => s.state === state && !s.held)]);
  return [topBar(), el("main", {}, el("div", { class: "wrap" },
    data.sessions.length === 0 ? el("p", { class: "empty" }, "Nothing running right now.") : null,
    held.length ? [el("div", { class: "section" }, "Waiting for your answer"), held.map(sessionRow)] : null,
    groups.filter(([, list]) => list.length).map(([state, list]) => [el("div", { class: "section" }, label(state)), list.map(sessionRow)]),
    el("p", { class: "hint" }, data.away ? "Away is on: questions from agents wait here for your answer. Typing in Conductor always wins."
                                         : "Message any chat from here. Turn Away on to answer agents' questions from the phone.")))];
}

const STATUS = { "in-progress": "In progress", "in-review": "In review", done: "Done", canceled: "Canceled" };
const collapsed = () => JSON.parse(localStorage.getItem("agents.collapsed") || "{}");

function workspaceRow(w) {
  const sub = [w.title !== w.directory ? w.directory : null, STATUS[w.status], w.pinned ? "pinned" : null, w.chats > 1 ? `${w.chats} chats` : null].filter(Boolean).join(" · ");
  return el("button", { class: "row" + (w.held ? " held" : ""), disabled: !w.session, onclick: () => go({ name: "session", id: w.session, back: "workspaces" }) },
    el("img", { class: "icon" + (w.state === "idle" ? " idle" : ""), src: icon(w.state), alt: "" }),
    el("div", { class: "body" }, el("div", { class: "title" }, w.title, w.held ? el("span", { class: "chip accent" }, "waiting") : null), el("div", { class: "sub" }, sub)),
    el("div", { class: "age" }, w.updated ? ago(w.updated) : ""));
}

function workspacesView(list) {
  const folded = collapsed();
  const toggle = (id) => { const f = collapsed(); f[id] = !f[id]; localStorage.setItem("agents.collapsed", JSON.stringify(f)); lastFrame = ""; render(); };
  return [topBar(), el("main", {}, el("div", { class: "wrap" }, list.repos.map((repo) => {
    const active = repo.workspaces.filter((w) => w.state !== "idle").length;
    return [
      el("div", { class: "section" }, el("button", { onclick: () => toggle(repo.id) },
        el("span", {}, (folded[repo.id] ? "▸ " : "▾ ") + repo.name), el("span", { class: "count" }, active ? `${active} active · ${repo.workspaces.length}` : `${repo.workspaces.length}`))),
      folded[repo.id] ? null : repo.workspaces.map(workspaceRow),
    ];
  })))];
}

function transcriptNodes(entries) {
  const nodes = [];
  let steps = [];
  const flushSteps = () => {
    if (!steps.length) return;
    const key = steps[0].at + ":" + steps[0].text, open = openSteps.has(key);
    nodes.push(el("details", { class: "steps", open, ontoggle: (e) => e.target.open ? openSteps.add(key) : openSteps.delete(key) },
      el("summary", {}, steps.length === 1 ? steps[0].text : `${steps.length} steps · ${steps[steps.length - 1].text}`),
      steps.length > 1 ? steps.map((s) => el("div", {}, s.text)) : null));
    steps = [];
  };
  for (const m of entries) {
    if (m.role === "tool") { steps.push(m); continue; }
    flushSteps();
    if (m.role === "assistant") nodes.push(el("div", { class: "agent", html: markdown(m.text) }));
    else if (m.role === "note") nodes.push(el("div", { class: "note" }, m.text));
    else nodes.push(el("div", { class: "bubble" + (m.status === "failed" ? " failed" : "") }, m.text,
      m.role === "phone" ? el("span", { class: "status" }, { sending: "sending…", delivered: "sent from phone", failed: "not delivered" }[m.status] || "") : null));
  }
  flushSteps();
  return nodes;
}

async function sessionView() {
  const { entries, held, session: s, reachable } = await api(`/api/sessions/${view.id}/messages?limit=80`);
  if (!s) return { frame: "missing", nodes: listView() };
  const frame = JSON.stringify([entries, held, s.state, reachable]);
  const box = el("textarea", { rows: 1, enterkeyhint: touch ? "enter" : "send", placeholder: held ? "Reply…" : reachable ? "Message this chat…" : "Agent not running — open it in Conductor first" });
  const button = el("button", { class: "send", "aria-label": "Send", disabled: true }, "↑");
  const grow = () => { box.style.height = "auto"; box.style.height = Math.min(box.scrollHeight, 160) + "px"; button.disabled = !box.value.trim(); };
  box.value = view.draft || "";
  box.addEventListener("input", () => { view.draft = box.value; grow(); });
  const send = async (text) => {
    text = (text || "").trim();
    if (!text) return;
    button.disabled = true;
    try { const r = await api(`/api/sessions/${s.id}/reply`, { text }); view.draft = ""; box.value = ""; grow(); box.blur(); toast(r.detail); lastFrame = ""; render(); }
    catch (e) { toast(e.message); button.disabled = false; }
  };
  box.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" || e.isComposing) return;
    if (e.metaKey || e.ctrlKey || (!touch && !e.shiftKey)) { e.preventDefault(); send(box.value); }
  });
  button.addEventListener("click", () => send(box.value));
  setTimeout(grow);
  const question = held && held.kind === "question" ? held.questions[0] : null;
  const nodes = [
    el("header", {}, el("div", { class: "wrap" },
      el("button", { class: "back", "aria-label": "Back", onclick: () => go({ name: view.back || "list" }) }, "‹"),
      el("img", { class: "icon" + (s.state === "idle" ? " idle" : ""), src: icon(s.state), alt: "" }),
      el("div", { class: "titles" }, el("h1", {}, s.name),
        el("div", { class: "meta" }, [s.place !== s.name ? s.place : null, s.unit, label(s.state), ago(s.since)].filter(Boolean).join(" · "))))),
    el("main", {}, el("div", { class: "wrap" }, entries.length ? transcriptNodes(entries) : el("p", { class: "empty" }, "No messages yet."))),
    el("div", { class: "dock" }, el("div", { class: "wrap" },
      el("div", { class: "dock-top" },
        question ? el("div", { class: "waiting" }, question.question) : null,
        question ? el("div", { class: "options" }, (question.options || []).map((o) => el("button", { onclick: () => send(o.label || o) }, o.label || o))) : null),
      el("div", { class: "composer" }, box, button),
      el("div", { class: "keys" }, "Enter to send · Shift+Enter for a new line"))),
  ];
  return { frame, nodes };
}

async function render() {
  if (!store.token) { if (lastFrame !== "pair") { app.replaceChildren(pairView()); lastFrame = "pair"; } return; }
  try {
    data = await api("/api/sessions");
    if (view.name === "session") {
      const { frame, nodes } = await sessionView();
      if (frame === lastFrame) return;
      const first = !lastFrame, nearBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 80;
      const dock = app.querySelector(".dock");
      lastFrame = frame;
      if (!first && dock && app.dataset.session === view.id) {  // keep the message box (focus, draft, caret); swap everything around it
        app.querySelector("header").replaceWith(nodes[0]);
        app.querySelector("main").replaceWith(nodes[1]);
        dock.querySelector(".dock-top").replaceWith(nodes[2].querySelector(".dock-top"));
      } else {
        app.replaceChildren(...nodes);
        app.dataset.session = view.id;
      }
      if (first || nearBottom) window.scrollTo(0, document.body.scrollHeight);
      return;
    }
    const content = view.name === "workspaces" ? await api("/api/workspaces") : null;
    const frame = JSON.stringify([view.name, data, content]);
    if (frame === lastFrame) return;
    lastFrame = frame;
    const y = window.scrollY;
    app.replaceChildren(...[].concat(view.name === "workspaces" ? workspacesView(content) : listView()).flat(Infinity));
    window.scrollTo(0, y);
  } catch (e) { if (store.token) toast(e.message); }
}

function refresh() { clearTimeout(timer); render().finally(() => { timer = setTimeout(refresh, 3000); }); }

const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get("pair")) pair({ secret: hash.get("pair") });
refresh();
</script>
</body>
